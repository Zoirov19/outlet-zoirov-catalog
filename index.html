
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Outlet.zoirov — Online katalog</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
    font-family: Arial, sans-serif;
    background: #f5efe8;
    color: #3b1f2a;
    }

header {
  position: relative;
  background: linear-gradient(135deg, #74122e, #941b3c);
  color: white;
  padding: 32px 24px 32px 155px;
  text-align: center;
  min-height: 150px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

header::before {
  content: "";
  position: absolute;
  left: 24px;
  top: 50%;
  transform: translateY(-50%);
  width: 105px;
  height: 105px;
  background-image: url("logo.jpeg");
  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;
  border-radius: 50%;
  border: 3px solid #f3dce3;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
}

header h1 {
  margin: 0 0 8px;
  font-size: 30px;
}

header p {
  margin: 0;
  color: #f3dce3;
}

@media (max-width: 600px) {
  header {
    padding: 24px 12px 24px 88px;
    min-height: 120px;
    text-align: left;
  }

  header::before {
    left: 12px;
    width: 64px;
    height: 64px;
  }

  header h1 {
    font-size: 23px;
  }

  header p {
    font-size: 13px;
  }
}


}
    .sale {
      margin-top: 15px;
      display: inline-block;
      background: #facc15;
      color: #111827;
      padding: 8px 14px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 13px;
    }
    .sale {
    display: none;
    margin-top: 15px;
    /* qolgan mavjud qatorlar saqlanadi */
}
    .container {
      width: min(1200px, 100%);
      margin: auto;
      padding: 20px 14px 40px;
    }
    .intro { margin-bottom: 18px; }
    .intro h2 { margin-bottom: 6px; }
    .intro p { color: #666; margin-top: 0; }
    .search {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 20px;
      background: white;
    }
    .products {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
    }
    .card {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      border: 1px solid #ececec;
      box-shadow: 0 4px 15px #00000008;
    }
    .photo {
      position: relative;
      background: #f2eee8;
      aspect-ratio: 4 / 5;
      overflow: hidden;
    }
    .photo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .discount {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #dc2626;
      color: white;
      font-size: 12px;
      font-weight: bold;
      border-radius: 7px;
      padding: 7px 9px;
    }
    .details { padding: 14px; }
    .details h3 {
      font-size: 15px;
      line-height: 1.45;
      margin: 0 0 12px;
      min-height: 44px;
    }
    .prices {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .new-price { font-size: 19px; font-weight: bold; color: #dc2626; }
    .old-price { font-size: 13px; color: #888; text-decoration: line-through; }
    button {
      cursor: pointer;
      border: 0;
      border-radius: 9px;
      font-weight: bold;
      font-size: 14px;
      padding: 12px;
    }
    .add {
      background: #111827;
      color: white;
      width: 100%;
    }
    .add:hover { background: #374151; }
    .cart {
      margin-top: 28px;
      background: white;
      padding: 20px;
      border-radius: 15px;
      border: 1px solid #e5e5e5;
    }
    .cart h2 { margin-top: 0; }
    .cart-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }
    .cart-row small { color: #666; display: block; margin-top: 4px; }
    .qty { display: flex; align-items: center; gap: 9px; }
    .qty button { padding: 7px 11px; background: #eee; }
    .total {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 19px;
      font-weight: bold;
      margin: 18px 0;
    }
    .order {
      width: 100%;
      background: #16a34a;
      color: white;
      font-size: 16px;
    }
    .empty { color: #777; }
    footer {
      text-align: center;
      padding: 22px 14px;
      color: #777;
      font-size: 13px;
    }
    @media (max-width: 900px) {
      .products { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    }
    @media (max-width: 600px) {
      header h1 { font-size: 25px; }
      .products { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .details { padding: 10px; }
      .details h3 { font-size: 13px; min-height: 55px; }
      .new-price { font-size: 16px; }
      .old-price { font-size: 12px; }
      button { font-size: 13px; }
      .cart { padding: 14px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Outlet.zoirov</h1>
    <p>Online katalog — yoqimli narxlar, ajoyib sovg‘alar</p>
    <span class="sale">🔥 Maxsus chegirma: 45 000 so‘m</span>
  </header>

  <main class="container">
    <section class="intro">
      <h2>Mahsulotlar katalogi</h2>
      <p>O‘zingizga yoqqan mahsulotni tanlang va savatga qo‘shing.</p>
    </section>

    <input
      id="search"
      class="search"
      type="search"
      placeholder="Mahsulot qidirish..."
      aria-label="Mahsulot qidirish"
    >

    <section id="products" class="products"></section>

    <section class="cart" id="cart">
      <h2>🛒 Savatingiz</h2>
      <div id="cart-items"><p class="empty">Hozircha savat bo‘sh.</p></div>
      <div class="total">
        <span>Jami:</span>
        <span id="total">0 so‘m</span>
      </div>
      <button class="order" onclick="orderProducts()">
        Telegram orqali buyurtma berish
      </button>
    </section>
  </main>

  <footer>
    © <span id="year"></span> Outlet.zoirov · Online katalog
  </footer>

  <script>
    const products = [
      { id: 1, name: "Bolalar tug‘ilgan kuni uchun shar nabor — 1", image: "product-1.jpeg", price: 45000, oldPrice: 65000 },
      { id: 2, name: "Bolalar tug‘ilgan kuni uchun shar nabor — 2", image: "product-2.jpeg", price: 45000, oldPrice: 65000 },
      { id: 3, name: "Bolalar tug‘ilgan kuni uchun shar nabor — 3", image: "product-3.jpeg", price: 45000, oldPrice: 65000 },
      { id: 4, name: "Bolalar tug‘ilgan kuni uchun shar nabor — 4", image: "product-4.jpeg", price: 45000, oldPrice: 65000 },
      { id: 5, name: "Bolalar tug‘ilgan kuni uchun shar nabor — 5", image: "product-5.jpeg", price: 45000, oldPrice: 65000 },
      { id: 6, name: "Bolalar tug‘ilgan kuni uchun shar nabor — 6", image: "product-6.jpeg", price: 45000, oldPrice: 65000 },
      { id: 7, name: "Bolalar tug‘ilgan kuni uchun shar nabor — 7", image: "product-7.jpeg", price: 45000, oldPrice: 65000 }
    ];

    const cart = {};

    function money(value) {
      return value.toLocaleString("uz-UZ") + " so‘m";
    }

    function renderProducts() {
      const query = document.getElementById("search").value.toLowerCase().trim();
      const filtered = products.filter(p => p.name.toLowerCase().includes(query));
      const container = document.getElementById("products");

      if (!filtered.length) {
        container.innerHTML = "<p>Mahsulot topilmadi.</p>";
        return;
      }

      container.innerHTML = filtered.map(p => `
        <article class="card">
          <div class="photo">
            <img src="${p.image}" alt="${p.name}" loading="lazy">
            <span class="discount">-31%</span>
          </div>
          <div class="details">
            <h3>${p.name}</h3>
            <div class="prices">
              <span class="new-price">${money(p.price)}</span>
              <span class="old-price">${money(p.oldPrice)}</span>
            </div>
            <button class="add" onclick="addToCart(${p.id})">
              Savatga qo‘shish
            </button>
          </div>
        </article>
      `).join("");
    }

    function addToCart(id) {
      cart[id] = (cart[id] || 0) + 1;
      renderCart();
    }

    function changeQty(id, change) {
      cart[id] = (cart[id] || 0) + change;
      if (cart[id] <= 0) delete cart[id];
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById("cart-items");
      const ids = Object.keys(cart);
      if (!ids.length) {
        container.innerHTML = '<p class="empty">Hozircha savat bo‘sh.</p>';
        document.getElementById("total").textContent = money(0);
        return;
      }

      let total = 0;
      container.innerHTML = ids.map(id => {
        const p = products.find(item => item.id === Number(id));
        const qty = cart[id];
        total += p.price * qty;
        return `
          <div class="cart-row">
            <div>
              <strong>${p.name}</strong>
              <small>${money(p.price)} × ${qty}</small>
            </div>
            <div class="qty">
              <button onclick="changeQty(${p.id}, -1)" aria-label="Kamaytirish">−</button>
              <span>${qty}</span>
              <button onclick="changeQty(${p.id}, 1)" aria-label="Ko‘paytirish">+</button>
            </div>
          </div>
        `;
      }).join("");

      document.getElementById("total").textContent = money(total);
    }

    function orderProducts() {
      const ids = Object.keys(cart);
      if (!ids.length) {
        alert("Avval savatga mahsulot qo‘shing.");
        return;
      }

      let total = 0;
      const lines = ids.map(id => {
        const p = products.find(item => item.id === Number(id));
        total += p.price * cart[id];
        return `${p.name} — ${cart[id]} dona — ${money(p.price * cart[id])}`;
      });

      const message =
        "Assalomu alaykum! Outlet.zoirov katalogidan buyurtma bermoqchiman:\n\n" +
        lines.join("\n") +
        "\n\nJami: " + money(total);

      const url = "https://t.me/share/url?url=" +
        encodeURIComponent("https://zoirov19.github.io/outlet-zoirov-catalog/") +
        "&text=" + encodeURIComponent(message);

      window.open(url, "_blank");
    }

    document.getElementById("search").addEventListener("input", renderProducts);
    document.getElementById("year").textContent = new Date().getFullYear();

    renderProducts();
    renderCart();
  </script>
</body>
</html>
